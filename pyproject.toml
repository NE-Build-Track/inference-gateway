[project]
name = "inference-gateway"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Extensible OpenAI and Anthropic protocol gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "anyio>=4,<5",
    "livepeer-builder @ git+https://github.com/NE-Build-Track/livepeer-builder-core.git@0d0b53205cd4047e9151e8a67169585af38686c8",
]

[project.urls]
Homepage = "https://github.com/NE-Build-Track/inference-gateway"
Issues = "https://github.com/NE-Build-Track/inference-gateway/issues"

[project.scripts]
gateway = "inference_gateway.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.9,<1", "mypy>=1.14,<2", "openai>=1.60,<3", "anthropic>=0.45,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.hatch.metadata]
allow-direct-references = true
