# Reuse the existing ChatLPT payment stack; do not enable payment-stack with this overlay.
# The existing Clearinghouse database holds the allocation in the copied deploy/.env.
services:
  gateway:
    networks:
      - default
      - chatlpt-payment
    environment:
      LPB_SIGNER_URL: http://clearinghouse:8937
      LPB_BATTERIES_URL: http://clearinghouse:8081

networks:
  chatlpt-payment:
    external: true
    name: ${CHATLPT_NETWORK:-chatlpt_default}
