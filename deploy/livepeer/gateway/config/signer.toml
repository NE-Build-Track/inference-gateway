# livepeer/node remote signer (on-chain: needs a funded broadcaster deposit and reserve on Arbitrum One).
Listen = "0.0.0.0:8937"
MetricsListen = "127.0.0.1:8938"
RPCURLFile = "/run/secrets/rpc-url"
KeystoreFile = "/run/secrets/keystore.json"
KeystorePasswordFile = "/run/secrets/keystore-password"
MaxHourlyPrice = "100"
# Orchestrators set their own ticket terms and keep the surplus of a fixed-price request, so
# bound both the price and each ticket's expected value (wei; about $0.0002 at $2,350/ETH).
MaxFixedPrice = "0.01"
MaxTicketEV = "100000000000"
AuthWebhookFile = "/run/secrets/webhook-url"
AuthWebhookHeadersFile = "/run/secrets/webhook-headers"
# The signer only signs payments. Orchestrators are listed for builder-core's discovery service in
# config/orchestrators.txt (builder-core D43).

[Kafka]
Broker = "kafka://127.0.0.1:9092"
Topic = "livepeer-signing"
AuthMethod = "scram-sha-512"
UsernameFile = "/run/secrets/kafka-username"
PasswordFile = "/run/secrets/kafka-password"
OutboxDB = "/data/signer-events.sqlite"
