name: inference-gateway

services:
  clearinghouse:
    profiles: [payment-stack]
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}inference-clearinghouse:${IMAGE_TAG:-d47d1ff}
    build:
      context: https://github.com/livepeer/clearinghouse-batteries.git#d47d1ff32b1fe373b6bd19de4402ea652de89af3
      dockerfile: examples/compose/Dockerfile
      args:
        COMMIT: d47d1ff32b1fe373b6bd19de4402ea652de89af3
    command: [serve, --config-file, /etc/clearinghouse.toml]
    volumes:
      - paid-state:/data
      - ./config/clearinghouse.toml:/etc/clearinghouse.toml:ro
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8081/readyz]
      interval: 5s
      retries: 12
    restart: unless-stopped

  signer:
    profiles: [payment-stack]
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}inference-node:${IMAGE_TAG:-a4b68ed}
    build:
      context: https://github.com/livepeer/node.git#a4b68ed1e6095d22cec5c16a0467ddc00afb7efc
      dockerfile: docker/Dockerfile
      args:
        COMMIT: a4b68ed1e6095d22cec5c16a0467ddc00afb7efc
    user: "0:0"  # dev only: lets the container read bind-mounted secrets regardless of host uid
    network_mode: service:clearinghouse  # Kafka and the webhook listen on this namespace's loopback
    entrypoint: ["/usr/local/bin/livepeer-signer"]
    command: [--data-dir, /data/node, --config, /etc/signer.toml]
    volumes:
      - paid-state:/data
      - ./config/signer.toml:/etc/signer.toml:ro
      - ./secrets:/run/secrets:ro
    depends_on:
      clearinghouse:
        condition: service_healthy
    restart: unless-stopped

  # livepeer/node's livepeer-discovery in static mode, as Builder Core v0.2.0 expects (its D63): the
  # list is config/discovery.toml, and the signer only signs payments. Built from the node commit the
  # engine's discovery reader is tested against, not the signer's. No healthcheck: its /readyz is on a
  # loopback metrics port, says only that the process listens, and the image has no HTTP client.
  discovery:
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}inference-discovery:${IMAGE_TAG:-f45d83f}
    build:
      context: https://github.com/livepeer/node.git#f45d83fd68f73d195dffe8b45f6cac296d023c49
      dockerfile: docker/Dockerfile
      args:
        COMMIT: f45d83fd68f73d195dffe8b45f6cac296d023c49
    entrypoint: ["/usr/local/bin/livepeer-discovery"]
    command: [--config, /etc/livepeer/discovery.toml]
    environment:
      SSL_CERT_DIR: /etc/ssl/certs:/etc/ssl/pinned  # Go reads both, as OpenSSL did
    volumes:
      - ./config/discovery.toml:/etc/livepeer/discovery.toml:ro
      - ./config/runner-trust:/etc/ssl/pinned:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  gateway:
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}inference-gateway:${IMAGE_TAG:-local}
    build:
      context: ../../..
      dockerfile: deploy/livepeer/gateway/Dockerfile
    env_file:
      - path: .env
        required: true
    environment:
      LPB_ENGINE_ID: endpoint-gateway
      LPB_DATABASE_URL: sqlite+aiosqlite:////data/livepeer-builder.db
      LPB_HTTP_HOST: 127.0.0.1
      LPB_DISCOVERY_URL: ${LPB_DISCOVERY_URL:-http://discovery:8939/discovery}
      LPB_MAX_PAID_ATTEMPTS: ${LPB_MAX_PAID_ATTEMPTS:-2}
      # The embedded engine owns paid jobs; discovery supplies runner inventory.
      GATEWAY_BACKEND: ${GATEWAY_BACKEND:-livepeer}
      GATEWAY_ACCOUNTING_DB: ${GATEWAY_ACCOUNTING_DB:-/data/gateway.db}
      GATEWAY_APPLICATION_ID: ${GATEWAY_APPLICATION_ID:-endpoint-gateway}
      GATEWAY_ACTOR_ID: ${GATEWAY_ACTOR_ID:-shared-application}
      GATEWAY_CHAT_APP: ${GATEWAY_CHAT_APP:-blueclaw/chat/qwen3.8-27b}
      GATEWAY_MODEL_NAME: ${GATEWAY_MODEL_NAME:-qwen3.8-27b}
      GATEWAY_APPROVED_ORCHESTRATORS: ${GATEWAY_APPROVED_ORCHESTRATORS:-}
      GATEWAY_TIMEOUT_SECONDS: ${GATEWAY_TIMEOUT_SECONDS:-300}
      GATEWAY_UPSTREAM_MODEL: ${GATEWAY_UPSTREAM_MODEL:-}
      # Empty selects the single-model settings above; JSON can configure multiple routes.
      GATEWAY_MODEL_ROUTES: ${GATEWAY_MODEL_ROUTES:-}
      # Operator evidence for native routes, including System One; an empty array admits none.
      GATEWAY_NATIVE_APPROVALS: ${GATEWAY_NATIVE_APPROVALS:-[]}
      SSL_CERT_DIR: /etc/ssl/certs:/etc/ssl/pinned
    ports: ["127.0.0.1:${GATEWAY_PORT:-8000}:8000"]
    volumes:
      - gateway-data:/data
      - ./config/runner-trust:/etc/ssl/pinned:ro
    # Start the payment-stack profile explicitly, or configure independent payment services.
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  gateway-data:
  paid-state:
