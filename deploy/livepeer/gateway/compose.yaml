name: inference-gateway

services:
  clearinghouse:
    profiles: [payment-stack]
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}inference-gateway/clearinghouse:ca09e47
    build:
      context: https://github.com/NE-Build-Track/clearinghouse-batteries.git#ca09e47c067682fb48c3f15425546fb6aa5b6659
      dockerfile: examples/compose/Dockerfile
    command: [serve, --config-file, /etc/clearinghouse.toml]
    volumes:
      - paid-state:/data
      - ./config/clearinghouse.toml:/etc/clearinghouse.toml:ro
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8081/readyz]
      interval: 5s
      retries: 12
    restart: unless-stopped

  signer:
    profiles: [payment-stack]
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}inference-gateway/node:406b248
    build:
      context: https://github.com/NE-Build-Track/node.git#406b248f6cb8728e6e7eba1809901f589060bc6b
      dockerfile: docker/Dockerfile
    user: "0:0"  # dev only: lets the container read bind-mounted secrets regardless of host uid
    network_mode: service:clearinghouse  # Kafka and the webhook listen on this namespace's loopback
    entrypoint: ["/usr/local/bin/livepeer-signer"]
    command: [--data-dir, /data/node, --config, /etc/signer.toml]
    volumes:  # the signer only signs (builder-core D43): no orchestrator list, no pinned certificates
      - paid-state:/data
      - ./config/signer.toml:/etc/signer.toml:ro
      - ./secrets:/run/secrets:ro
    depends_on:
      clearinghouse:
        condition: service_healthy
    restart: unless-stopped

  # builder-core's discovery service (`lpb discovery`) at the commit the gateway pins: the static directory
  # in config/orchestrators.txt. It trusts the same certificates as the gateway (runner-trust), so pinned
  # orchestrators stay discoverable and untrusted ones are left out.
  discovery:
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}inference-gateway/discovery:985f23d
    build:
      context: https://github.com/NE-Build-Track/livepeer-builder-core.git#985f23d4da7646b76a99810e94af8019011d2bb2
      dockerfile: deploy/dev-stack/engine/Dockerfile
      args:
        BUILDKIT_CONTEXT_KEEP_GIT_DIR: "1"  # hatch-vcs derives the version from .git
    command: [lpb, discovery]
    environment:
      LPD_ORCHESTRATORS: /etc/lpd/orchestrators.txt
      LPD_HTTP_HOST: 0.0.0.0
      SSL_CERT_DIR: /etc/ssl/certs:/etc/ssl/pinned
    volumes:
      - ./config/orchestrators.txt:/etc/lpd/orchestrators.txt:ro
      - ./config/runner-trust:/etc/ssl/pinned:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8939/healthz')"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  gateway:
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}inference-gateway/gateway:local
    build:
      context: ../../..
      dockerfile: deploy/livepeer/gateway/Dockerfile
    env_file:
      - path: .env
        required: true
    environment:
      LPB_ENGINE_ID: endpoint-gateway
      LPB_DATABASE_URL: sqlite+aiosqlite:////data/livepeer-builder.db
      LPB_HTTP_HOST: 127.0.0.1
      LPB_DISCOVERY_URL: ${LPB_DISCOVERY_URL:-http://discovery:8939/discovery}  # runners (builder-core D43)
      # The embedded engine owns paid jobs and its persistent records; runners come from the discovery service.
      GATEWAY_BACKEND: ${GATEWAY_BACKEND:-livepeer}
      GATEWAY_ACCOUNTING_DB: ${GATEWAY_ACCOUNTING_DB:-/data/gateway.db}
      GATEWAY_APPLICATION_ID: ${GATEWAY_APPLICATION_ID:-endpoint-gateway}
      GATEWAY_ACTOR_ID: ${GATEWAY_ACTOR_ID:-shared-application}
      GATEWAY_CHAT_APP: ${GATEWAY_CHAT_APP:-blueclaw/chat/qwen3.8-27b}
      GATEWAY_MODEL_NAME: ${GATEWAY_MODEL_NAME:-qwen3.8-27b}
      GATEWAY_APPROVED_ORCHESTRATORS: ${GATEWAY_APPROVED_ORCHESTRATORS:-}
      GATEWAY_TIMEOUT_SECONDS: ${GATEWAY_TIMEOUT_SECONDS:-300}
      GATEWAY_UPSTREAM_MODEL: ${GATEWAY_UPSTREAM_MODEL:-}
      # Empty selects the single-model settings above; JSON can configure multiple routes.
      GATEWAY_MODEL_ROUTES: ${GATEWAY_MODEL_ROUTES:-}
      SSL_CERT_DIR: /etc/ssl/certs:/etc/ssl/pinned
    ports: ["127.0.0.1:${GATEWAY_PORT:-8000}:8000"]
    volumes:
      - gateway-data:/data
      - ./config/runner-trust:/etc/ssl/pinned:ro
    # Start the payment-stack profile explicitly, or configure independent payment services.
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  gateway-data:
  paid-state:
