name: inference-orchestrator
services:
  orchestrator:
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}inference-node:${IMAGE_TAG:-a4b68ed}
    build:
      context: https://github.com/livepeer/node.git#a4b68ed1e6095d22cec5c16a0467ddc00afb7efc
      dockerfile: docker/Dockerfile
      args:
        COMMIT: a4b68ed1e6095d22cec5c16a0467ddc00afb7efc
    # Bind-mounted operator secrets can be owner-only; host/container UID mapping is operator-owned.
    user: "0:0"
    command: [orchestrator, --config, /etc/livepeer/orchestrator.toml]
    ports:
      - "${ORCHESTRATOR_BIND:-127.0.0.1}:${ORCHESTRATOR_PORT:-8935}:8935"
    volumes:
      - ./config/generated/orchestrator.toml:/etc/livepeer/orchestrator.toml:ro
      - ./config/generated/runners.toml:/etc/livepeer/runners.toml:ro
      - ./secrets:/run/secrets:ro
      - orchestrator-data:/data
    depends_on:
      vllm:
        condition: service_healthy
      readiness:
        condition: service_started
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
  vllm:
    # Pinned by digest: the runner's deployment_revision hashes it (vllm/vllm-openai:v0.11.0).
    image: ${VLLM_IMAGE:-vllm/vllm-openai@sha256:014a95f21c9edf6abe0aea6b07353f96baa4ec291c427bb1176dc7c93a85845c}
    command:
      - --model
      - ${MODEL_ID:-Qwen/Qwen2.5-0.5B-Instruct}
      - --revision
      - ${MODEL_REVISION:-7ae557604adf67be50417f59c2c2f167def9a775}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-gateway-model}
      - --port
      - "8000"
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.8}
      - --enable-auto-tool-choice
      - --tool-call-parser
      - ${TOOL_CALL_PARSER:-hermes}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - model-cache:/root/.cache/huggingface
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      start_period: 120s
      interval: 10s
      timeout: 5s
      retries: 60
    restart: unless-stopped
    logging: *logging
  readiness:
    # The node's HealthURL: ready only after the advertised profile's self-test passes.
    image: ${READINESS_IMAGE:-python@sha256:6dd8b6dab6b3adc7812bab69eca5dbdc1a5cc690ad28306d234ffb4ef8ac9753}
    command: [python, /app/readiness.py]
    volumes:
      - ./config/generated/readiness.py:/app/readiness.py:ro
      - ./config/generated/readiness.json:/app/readiness.json:ro
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    depends_on:
      vllm:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
volumes:
  orchestrator-data:
  model-cache:
